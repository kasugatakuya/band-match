services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bandmatch
      POSTGRES_PASSWORD: bandmatch
      POSTGRES_DB: bandmatch
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandmatch"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # 受信メール確認用の画面

volumes:
  pgdata:
